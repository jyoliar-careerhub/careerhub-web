# G1 — PR 머지 게이트: 빠른 검사(타입·린트)만 둔다.
# 느린 검사(e2e 등)는 이 게이트의 범위가 아니다 (ops-workflow#10 Requirements).
name: g1

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # 계약 드리프트 — 커밋된 생성물이 핀한 좌표와 일치하는가.
  # typecheck와 둘 다 필요하다: diff만으로는 "타입은 최신인데 앱이 안 맞음"을,
  # typecheck만으로는 "타입이 낡음"을 못 잡는다 (ops-workflow#12 Requirements).
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 로컬이 부르는 것과 같은 스크립트다 — 다른 경로로 생성하면 게이트가 자기 자신을 검사하게 된다.
      # 생성기는 npx로 격리 실행되므로 npm ci가 필요 없다.
      - name: 핀한 좌표에서 재생성
        # provider들이 private이라 Actions의 GITHUB_TOKEN(자기 저장소 한정)으로는 못 읽는다.
        # SPEC_READ_TOKEN = 두 provider(api-composer·auth-service)에 대한 Contents: read —
        # auth-service 핀이 생기며(ops-workflow#54) 범위가 둘로 늘었다.
        env:
          GH_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          npm run gen:api
          npm run gen:api:auth
      - name: 재생성 결과와 커밋된 생성물이 같은가
        run: |
          if ! git diff --exit-code; then
            echo "::error::생성물이 핀한 좌표와 어긋났다 — 로컬에서 'npm run gen:api' 후 커밋한다 (생성물은 손으로 고치지 않는다)."
            exit 1
          fi
